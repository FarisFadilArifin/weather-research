[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-research"
version = "0.1.0"
description = "Research pipeline for daily high-temperature forecast calibration and station-stacking experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "pyarrow>=15",
    "numpy==2.5.1",
    "requests==2.34.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "xarray==2026.7.0",
    "cfgrib==0.9.15.1",
    "eccodes==2.47.0",
    "ecmwflibs==0.7.0",
    "timezonefinder>=6.5",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "xgboost==3.3.0",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "optuna>=3.6",
    "mostlyrightmd[research]==1.17.0",
    "mostlyrightmd-weather[nwp]==1.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
include = ["src*"]
